unit_tests:
  - name: test_duplicate_order_keeps_the_first
    model: int_orders_checked
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2024-01-01', quantity: 2, unit_price: 19.99, country: 'France',  _row_number: 1 }
          - {order_id: 1, customer_id: 10, order_date: '2024-01-01', quantity: 2, unit_price: 19.99, country: 'France', _row_number: 2 }
    expect:
      rows:
        - {_row_number: 1, reject_reason: null}
        - {_row_number: 2, reject_reason: 'duplicate_order_id'}

